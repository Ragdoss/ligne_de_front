name: Notify Discord
on: [push]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer sur Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MESSAGE: "Nouveau push par ${{ github.actor }} : ${{ github.event.head_commit.message }}"
        run: |
          jq -n --arg msg "$MESSAGE" '{content: $msg}' | curl -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
